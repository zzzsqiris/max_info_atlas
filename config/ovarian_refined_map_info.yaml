run_name: "ovarian_refined_map_info"
description: "Refined ovarian Map Information sweep around resolution 0.095"

input:
  adata: XeniumOvarianReproduction/data/raw/ovarian_xenium_genes.h5ad
  xy_dir: XeniumOvarianReproduction/data/processed/xy_coordinates
  sections_file: XeniumOvarianReproduction/data/processed/Sections.npy

output:
  base_dir: XeniumOvarianReproduction/results/refined_map_info
  features_dir: /u/home/s/sqzhong/project-rwollman/max_info_atlas/XeniumOvarianReproduction/results/full_map_info/features
  graphs_dir: /u/home/s/sqzhong/project-rwollman/max_info_atlas/XeniumOvarianReproduction/results/full_map_info/graphs
  clustering_dir: clustering
  percolation_dir: percolation_results
  edge_lists_dir: /u/home/s/sqzhong/project-rwollman/max_info_atlas/XeniumOvarianReproduction/results/full_map_info/edge_lists
  jobs_dir: jobs
  logs_dir: logs
  scores_csv: ovarian_percolation_scores.csv
  reduced_scores_csv: ovarian_percolation_scores_reduced.csv

steps:
  features:
    data_types:
      - pca50

  graphs:
    k: 15
    distances:
      - correlation

  clustering:
    leiden:
      enabled: true
      data_types:
        - pca50
      distances:
        - correlation
      n_resolutions: 51
      resolution_log_min: -1.30103
      resolution_log_max: -0.743523

  percolation:
    max_k: 500
    pbond_steps: 101

  aggregation:
    output_csv: ovarian_percolation_scores.csv

hpc:
  conda_env: xenium-mapinfo
  default_chunk_size: 1
  resources:
    features:
      memory: "64G"
      runtime: "24:00:00"
      chunk_size: 1
    graphs:
      memory: "256G"
      runtime: "4:00:00"
      chunk_size: 1
    clustering:
      memory: "128G"
      runtime: "2:00:00"
      chunk_size: 1
    percolation:
      memory: "64G"
      runtime: "12:00:00"
      chunk_size: 1
    aggregation:
      memory: "8G"
      runtime: "1:00:00"
      chunk_size: 1
